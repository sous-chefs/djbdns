driver:
  name: vagrant

provisioner:
  name: chef_zero
  product_name: chef
  # enforce_idempotency: true
  # multiple_converge: 2
  # TODO: packagecloud
  # deprecations_as_errors: true

verifier:
  name: inspec

platforms:
  - name: almalinux-9
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: centos-stream-10
  - name: debian-12
  - name: debian-13
  - name: fedora-42
  - name: opensuse-leap-16.0
  - name: oraclelinux-9
  - name: rockylinux-10
  - name: ubuntu-22.04
  - name: ubuntu-24.04

suites:
  - name: tinydns
    run_list:
      - recipe[test::default]

  - name: source
    run_list:
      - recipe[test::default]
    attributes:
      djbdns:
        install_method: source
