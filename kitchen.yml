driver:
  name: vagrant

provisioner:
  name: chef_zero
  product_name: chef
  # enforce_idempotency: true
  # multiple_converge: 2
  # TODO: packagecloud
  # deprecations_as_errors: true

verifier:
  name: inspec

platforms:
  - name: almalinux-9
  - name: centos-stream-9
  - name: debian-12
  - name: ubuntu-22.04
  - name: ubuntu-24.04

x-run_lists:
  default: &default_run_list
    - recipe[test::default]

x-verifiers:
  default: &default_verifier
    inspec_tests:
      - path: test/integration/default
  source: &source_verifier
    inspec_tests:
      - path: test/integration/source

suites:
  - name: default
    run_list: *default_run_list
    verifier: *default_verifier
  - name: source
    run_list: *default_run_list
    attributes:
      djbdns:
        install_method: source
    verifier: *source_verifier
