---
driver:
  name: vagrant

provisioner:
  name: chef_infra
  product_name: chef
  chef_license: accept
  deprecations_as_errors: true
  enforce_idempotency: true
  multiple_converge: 2

verifier:
  name: inspec
  sudo: true

platforms:
  - name: almalinux-9
  - name: amazonlinux-2023
  - name: centos-stream-9
  - name: debian-12
  - name: debian-13
  - name: fedora-latest
  - name: oraclelinux-9
  - name: rockylinux-9
  - name: ubuntu-22.04
  - name: ubuntu-24.04

x-run_lists:
  default: &default_run_list
    - recipe[test::default]
  source: &source_run_list
    - recipe[test::source]
  axfr: &axfr_run_list
    - recipe[test::axfr]

x-verifiers:
  default: &default_verifier
    inspec_tests:
      - path: test/integration/default
  source: &source_verifier
    inspec_tests:
      - path: test/integration/source
  axfr: &axfr_verifier
    inspec_tests:
      - path: test/integration/axfr

suites:
  - name: default
    run_list: *default_run_list
    verifier: *default_verifier

  - name: source
    run_list: *source_run_list
    verifier: *source_verifier

  - name: axfr
    run_list: *axfr_run_list
    verifier: *axfr_verifier
